<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Aperçu des formats · msplomberie</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e6ebef;color:#183453;font:15px/1.5 Arial,sans-serif}header{padding:15px 24px;background:white;border-bottom:1px solid #cbd5dc;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}p{margin:0;color:#546879;font-size:12px}nav{display:flex;gap:8px;flex-wrap:wrap}button,select,a{font:inherit}button,select{padding:10px;border:1px solid #a4b6c3;border-radius:4px;background:white;color:#183453;cursor:pointer}button[aria-pressed=true]{background:#183453;color:white}a{color:#183453}main{overflow:auto;padding:24px;display:flex;justify-content:safe center}iframe{width:390px;height:844px;border:0;background:white;box-shadow:0 10px 35px #18345330;border-radius:8px;flex:none}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #789c3f;outline-offset:3px}
</style>
<header>
  <div><h1>msplomberie · Aperçu des formats</h1><p>Affichage à largeur réelle. Faites défiler le site dans le cadre.</p></div>
  <nav aria-label="Largeur de l’aperçu">
    <button data-width="360" aria-pressed="false">Mobile 360 px</button>
    <button data-width="390" aria-pressed="true">Mobile 390 px</button>
    <button data-width="768" aria-pressed="false">Tablette 768 px</button>
    <button data-width="1280" aria-pressed="false">PC 1280 px</button>
  </nav>
  <label>Section <select id="section"><option value="">Accueil</option><option value="#savoir-faire">Savoir-faire</option><option value="#secteur">Zone d’intervention</option><option value="#contact">Contact</option><option value="#google">Google et QR code</option><option value="avis.html">Fiche QR code</option></select></label>
  <a href="./">Ouvrir le site</a>
</header>
<main><iframe src="./" title="Site msplomberie" id="site"></iframe></main>
<script>
const frame = document.querySelector('#site');
const previewVersion = '__MSP_PREVIEW_VERSION__';
frame.src = `./?apercu=${previewVersion}`;
document.querySelectorAll('[data-width]').forEach(button => button.addEventListener('click', () => {
  frame.style.width = `${button.dataset.width}px`;
  document.querySelectorAll('[data-width]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
}));
document.querySelector('#section').addEventListener('change', event => {
  frame.src = event.target.value === 'avis.html' ? `avis.html?apercu=${previewVersion}` : `./?apercu=${previewVersion}${event.target.value}`;
});
</script>
</html>
